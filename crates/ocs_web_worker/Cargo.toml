[package]
name = "ocs_web_worker"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
acadrust = { git = "https://github.com/schoeller/cadcodec.git", rev = "3992ec1878b1a766f815fe38edd1db8fcecb40c0", features = ["serde"] }
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }
js-sys = "0.3"
sha2 = "0.10"
wasm-bindgen = "0.2"
