[package]
name = "ocs_python_repl"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ocs_plugin_api = { path = "../ocs_plugin_api", features = ["host"] }
acadrust = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
interprocess = "2"

[dev-dependencies]
tempfile = "3"
